    data:
      - CV
    universes:
      -
        id: CV
        description: Central-value prediction, including MicroBooNE Tune
        recipe:
          -
            source: beam_off
            scaling: triggers
          -
            source:
              - numu
              - nue
              - dirt
            scaling: pot
            weight:
              tree: nuselection/NeutrinoSelectionFilter
              expr: weight_splines_general_Spline * weight_TunedCentralValue_UBGenie
