            edges: [-1.00, -0.55, -0.25, 0.00, 0.25, 0.45, 0.70, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.24, 0.30] } }
            edges: [-1.00, -0.55, -0.25, 0.00, 0.25, 0.45, 0.70, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.30, 0.38] } }
            edges: [-1.00, -0.40, -0.10, 0.10, 0.35, 0.50, 0.70, 0.85, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.38, 0.48] } }
            edges: [-1.00, 0.00, 0.50, 0.65, 0.80, 0.92, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.48, 0.70] } }
            edges: [-1.00, 0.20, 0.50, 0.65, 0.80, 0.875, 0.95, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.70, 0.85] } }
            edges: [-1.00, 0.65, 0.80, 0.875, 0.95, 1.00]
            underflow: false
            overflow: false
          - match: { p_mu: { edges: [0.85, 1.20] } }
            edges: [-1.00, 0.85, 0.90, 0.95, 1.00]
            underflow: false
            overflow: false
  reco:    { selection: "reco_is_selected", axes: truth }
  sideband: { selection: "sb_is_sideband", axes: truth }

